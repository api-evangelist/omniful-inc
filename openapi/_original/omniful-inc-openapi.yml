                country_code: US
                latitude: 34.0522
                longitude: -118.2437
                national_address_code: code
              order_created_at: '2023-07-28T09:00:00Z'
              invoice:
                currency: USD
                subtotal: 699
                shipping_price: 0
                shipping_refund: 0
                tax: 69.9
                discount: 100
                total: 768.9
                total_paid: 768.9
                total_due: 0
                total_refunded: 0
                payment_method: Credit Card
                tax_percent: 10
                shipping_tax: 0
                sub_total_tax_inclusive: true
                sub_total_discount_inclusive: true
                shipping_tax_inclusive: false
                shipping_discount_inclusive: false
              customer:
                first_name: John
                last_name: Doe
                mobile: '1234567890'
                mobile_code: '+1'
                email: john.doe@example.com
                avatar: https://example.com/avatar.jpg
                gender: male
              shipment:
                shipping_partner_name: CourierX
                shipping_partner_tag: courierx123
                awb_number: AWB-456
                awb_label: https://example.com/awb-label.jpg
                tracking_link: https://example.com/tracking/456
                shipment_method: auto-ship
              payment_method: prepaid
              is_cash_on_delivery: false
              note: Please deliver during weekdays
              external_fields:
              - key: order_id_1
                value: '12347'
              - key: customer_name
                value: John Doe
              cancel_order_after_seconds: 30
      responses:
        '200':
          description: Successful response
  /sales-channel/public/v1/invoice/{order_id}:
    put:
      summary: Update Order Invoice
      operationId: putUpdateOrderInvoice
      tags:
      - Orders
      description: 📌 Update Order Invoice API - Overview The Update Order Invoice API allows users to modify the invoice details
        of a previously placed order. This API is useful when adjustments or modifications are required in the invoice amount,
        tax details, discounts, payment information, or other financial components of an order. Users can use this API to
        ensure that the invoice reflects the correct pricing and charges before final processing or fulfillment. To successfully
        update an invoice, all the fields fr
      parameters:
      - name: order_id
        in: path
        required: true
        schema:
          type: string
      requestBody:
        content:
          application/json: {}
      responses:
        '200':
          description: Successful response
  /sales-channel/public/v1/orders/{order_id}/attachments:
    put:
      summary: Update Order Attachments
      operationId: putUpdateOrderAttachments2
      tags:
      - Orders
      description: 'Overview Updates attachments for an existing order. Use this request to add or update attachment metadata
        for the specified order, such as invoice or order. Endpoint PUT {{base_url}}/public/v1/orders/{{order_id}}/attachments
        Authentication This request uses the configured access token variable: {{access_token}} Validation Notes The attachments
        array can contain a maximum of 10 items. Path Parameters Parameter Type Required Description order_id string Yes The
        unique identifier of the order whose '
      parameters:
      - name: order_id
        in: path
        required: true
        schema:
          type: string
      requestBody:
        content:
          application/json:
            example:
              attachments:
              - name: Bill
                description: Bill description
                url: http://omniful-local-uploads.s3.eu-central-1.localstack.oceaninfra.localhost/orders/orders/attachments/98bf916bcb364c1656b0aca4a103b5ea71780922501.jpeg
                mime_type: image/jpeg
                entity: order
              - name: Bill 2
                description: Bill 2 description
                url: http://omniful-local-uploads.s3.eu-central-1.localstack.oceaninfra.localhost/orders/orders/attachments/98bf916bcb364c1656b0aca4a103b5ea71780922501.jpeg
                mime_type: image/jpeg
                entity: invoice
      responses:
        '200':
          description: Successful response
  /sales-channel/public/v1/orders/{order_id}/cancel:
    put:
      summary: Cancel Order
      operationId: putCancelOrder
      tags:
      - Orders
      description: 📌 Overview The Cancel Order API allows users to cancel an existing order by providing a cancellation reason.
        Field Type Required Description cancel_reason string ✅ Yes Reason for canceling the order.
      parameters:
      - name: order_id
        in: path
        required: true
        schema:
          type: string
      requestBody:
        content:
          application/json:
            example:
              cancel_reason: Not needed now.
      responses:
        '200':
          description: Successful response
  /sales-channel/public/v1/orders/{order_id}/approve:
    put:
      summary: Approve Order
      operationId: putApproveOrder
      tags:
      - Orders
      description: 📌 Approve Order API - Overview The Approve Order API is used to manually approve orders that require user
        authorization before processing. This API ensures that orders needing validation, review, or confirmation are not
        automatically processed without approval. Once an order is approved, it can proceed to the next stage in the fulfillment
        workflow, such as packing and shipping.
      parameters:
      - name: order_id
        in: path
        required: true
        schema:
          type: string
      responses:
        '200':
          description: Successful response
  /sales-channel/public/v1/seller/orders:
    get:
