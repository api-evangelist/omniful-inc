      description: 📌 Get Seller Orders API - Overview The Get Seller Orders API allows users to retrieve a list of all orders
        for a specific seller who has integrated a Custom Integration on their dashboard. This API enables sellers to fetch
        and manage orders placed within the last three months, providing real-time visibility into their order history. It
        is useful for tracking order statuses, processing fulfillment, and analyzing order trends over time. 📝 Response Body
        Parameters Field Data Type Description Always
      responses:
        '200':
          description: Successful response
  /sales-channel/public/v1/seller/orders/{order_id}:
    get:
      summary: Get Seller Order By OrderID
      operationId: getGetSellerOrderByOrderid
      tags:
      - Orders
      description: 📌 Get Seller Order by Order ID API - Overview The Get Seller Order by Order ID API allows users to fetch
        details of a single order for a seller using the Omniful-generated Order ID (omniful_order_id). This API is particularly
        useful for retrieving order details that were not placed through the Custom Sales Channel Integration. It provides
        complete order information, including order items, customer details, billing and shipping addresses, and invoice details,
        ensuring sellers have full visibility
      parameters:
      - name: order_id
        in: path
        required: true
        schema:
          type: string
      responses:
        '200':
          description: Successful response
    post:
      summary: Create Return Request
      operationId: postCreateReturnRequest
      tags:
      - Returns
      parameters:
      - name: order_id
        in: path
        required: true
        schema:
          type: string
      requestBody:
        content:
          application/json:
            example:
              order_id: '10456114397478'
              return_reason: Damaged and Wrong Items-reject
              hub_code: '132'
              order_items:
              - sku_code: '8904355400626'
                return_quantity: 1
                return_reasons:
                - reason: Damaged
                  quantity: 1
              return_request_id: RO12348372969
      responses:
        '200':
          description: Successful response
  /sales-channel/public/v1/orders/{order_id}/logs:
    get:
      summary: Get Order Logs (⚠️ To be deprecated on 30-07-2026)
      operationId: getGetOrderLogsToBeDeprecatedOn30072026
