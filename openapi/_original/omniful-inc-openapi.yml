openapi: 3.0.3
info:
  title: Omniful Integration APIs
  version: v1
  description: Omniful unified supply chain and fulfillment platform integration APIs (Order Management, Warehouse/Inventory,
    Returns, Purchase Orders, Shipment/TMS, Webhooks). Derived faithfully from the provider-published Postman collection at
    docs.omniful.tech; paths, methods, parameters, and request examples are as published, response schemas are not enumerated
    in the source.
  contact:
    url: https://docs.omniful.tech
servers:
- url: https://prodapi.omniful.com
security:
- bearerAuth: []
