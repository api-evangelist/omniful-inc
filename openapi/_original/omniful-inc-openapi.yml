              - key: order_id
                value: '12345'
              - key: customer_name
                value: John Doe
              - key: status
                value: shipped
              cancel_order_after_seconds: 30
              attachments:
              - name: Bill
                description: Bill description
                url: http://omniful-local-uploads.s3.eu-central-1.localstack.oceaninfra.localhost/orders/orders/attachments/98bf916bcb364c1656b0aca4a103b5ea71780922501.jpeg
                mime_type: image/jpeg
                entity: invoice
      responses:
        '200':
          description: Successful response
    put:
      summary: Update Order
      operationId: putUpdateOrder
      tags:
      - Orders
      description: 📌 Update Order API - Overview The Update Order API allows users to modify the details of an existing order
        that was previously placed. This API can be used to update various order attributes, such as order items, shipping
        details, billing information, and customer details. Users can update an order only if it is not in the "packed" state.
        Once an order reaches the packed stage, further modifications using this API are restricted. This API ensures flexibility
        in managing orders before final proce
      requestBody:
        content:
          application/json:
            example:
              order_id: order_0003
              hub_code: Shubhra001
              order_items:
              - sku_code: iPhone 15 Pro
                name: iPhone 15 Pro
                display_price: 799
                selling_price: 699
                is_substituted: false
                quantity: 2
                tax_percent: 10
                tax: 69.9
                unit_price: 699
                subtotal: 699
                total: 768.9
                discount: 100
                tax_inclusive: true
              billing_address:
                address1: 123 Main Street
                city: New York
                country: United States
                first_name: John
                last_name: Doe
                phone: 123-456-7890
                state: NY
                zip: '10001'
                state_code: NY
                country_code: US
                latitude: 40.7128
                longitude: -74.006
                national_address_code: code
              shipping_address:
                address1: 456 Elm Street
                city: Los Angeles
                country: United States
                first_name: Jane
                last_name: Smith
                phone: 987-654-3210
                state: CA
                zip: '90001'
