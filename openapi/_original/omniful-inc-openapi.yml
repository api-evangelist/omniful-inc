      responses:
        '200':
          description: Successful response
  /sales-channel/public/v1/orders/{order_id}/shipping_details:
    put:
      summary: Update Shipping Details
      operationId: putUpdateShippingDetails
      tags:
      - Orders
      description: 📌 Update Shipping Details API - Overview The Update Shipping Details API allows users to modify the shipping
        details for an order until it reaches the shipped state. This API ensures flexibility in updating recipient details,
        address, and contact information for a particular order, preventing delivery issues and ensuring accurate fulfillment.
        Users can only update the shipping address associated with a specific Order ID. Fields to be updated cannot be empty.
        No more than two fields can be update
      parameters:
      - name: order_id
        in: path
        required: true
        schema:
          type: string
      requestBody:
        content:
          application/json:
            example:
              fields_to_update:
              - slot
              - address
              address:
                address1: 129 Main Street
                address2: Apt 4B
                city: New York
                country: United States
                first_name: John
                last_name: Doe
                phone: +1 212-555-1234
                country_calling_code: '+1'
                country_code: US
                state: New York
                area: Manhattan
                district: Downtown
                zip: '10001'
                state_code: NY
                latitude: 40.712776
                longitude: -74.005974
                email: johndoe@example.com
                national_address_code: nac_1234
              slot:
                delivery_date: '12012026'
                start_time: 1500
                end_time: 2059
      responses:
        '200':
          description: Successful response
