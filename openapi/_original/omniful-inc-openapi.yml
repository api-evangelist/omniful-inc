paths:
  /sales-channel/public/v1/orders:
    post:
      summary: Create Order
      operationId: postCreateOrder
      tags:
      - Orders
      description: 📌 Create Order API Overview The Create Order API allows users to place new orders in Omniful by providing
        order details, customer information, shipping and billing addresses, invoice details, and payment information. 📝 Request
        Body Parameters Key Data Type Description Required order_id string Must be a globally unique identifier for the order
        (e.g., "order_0008"). Cannot be reused if the order is deleted. ✅ Yes order_alias string Secondary identifier for
        tracking in external systems (e.g., ERP o
      requestBody:
        content:
          application/json:
            example:
              shipment_type: omniful_generated
              order_id: order_no__1
              order_alias: order_omniful-alias
              hub_code: locoff
              order_items:
              - sku_code: UT-TSHIRT-WHT-S-17
                name: iPhone 15 Pro
                display_price: 799
                selling_price: 699
                is_substituted: false
                quantity: 1
                tax_percent: 10
                tax: 69.9
                unit_price: 699
                subtotal: 699
                total: 768.9
                discount: 100
                tax_inclusive: true
              billing_address:
                address1: 123 Al-Masjid Al-Haram Street
                address2: Near Al-Faisaliah Tower
                city: Riyadh
                country: Saudi Arabia
                first_name: John
                last_name: Doe
                phone: +966-11-234-5678
                state: Riyadh
                zip: '11564'
                area: Al Olaya
                district: Riyadh
                street: Kings Road
                state_code: RIY
                country_code: SA
                latitude: 24.7136
                longitude: 46.6753
                national_address_code: code
              shipping_address:
                address1: 456 King Abdulaziz Road
                address2: Near Kingdom Centre
                city: Jeddah
                country: Saudi Arabia
                first_name: Jane
                last_name: Smith
                phone: +966-12-345-6789
                state: Makkah
                zip: '21577'
                area: Al Olaya
                district: Riyadh
                street: Kings Road
                state_code: MKA
                country_code: SA
                latitude: 21.4225
                longitude: 39.8262
                national_address_code: code
              invoice:
                currency: USD
                subtotal: 699
                shipping_price: 0
                shipping_refund: 0
                tax: 69.9
                discount: 100
                total: 768.9
                total_paid: 768.9
                total_due: 0
                total_refunded: 0
                payment_mode: Credit Card
                tax_percent: 10
                shipping_tax: 0
                sub_total_tax_inclusive: true
                sub_total_discount_inclusive: true
                shipping_tax_inclusive: false
                shipping_discount_inclusive: false
              customer:
                id: 66ced351ffed27dec7c4072a
                first_name: John
                last_name: Doe
                mobile: '1234567890'
                mobile_code: '+1'
                email: john.doe@example.com
                avatar: https://example.com/avatar.jpg
                gender: male
              labels:
              - label1
              - label2
              - label3
              slot:
                delivery_date: '18122024'
                start_time: 1100
                end_time: 1500
              payment_method: prepaid
              delivery_type: normal_delivery
              is_cash_on_delivery: false
              note: Please deliver during weekdays
              type: b2b
