  /sales-channel/public/v1/orders/{order_id}/shipment:
    post:
      summary: Trigger Shipment
      operationId: postTriggerShipment
      tags:
      - Shipment
      description: '📌 Create Shipment API – Overview The Create Shipment API is used to generate shipments for orders in Omniful.
        This API allows users to: Assign a shipping partner Generate tracking numbers (AWB) Set shipment details Note: The
        API only supports orders with the shipment type set to Omniful Generated. Orders with other shipment types are not
        eligible for shipment creation through this API. Request Body Parameters Field Data Type Description Required number_of_boxes
        number Total number of packages to'
      parameters:
      - name: order_id
        in: path
        required: true
        schema:
          type: string
      requestBody:
        content:
          application/json:
            example:
              number_of_boxes: 1
              weight: 1.2
              remarks: Please handle shipment carefully,
      responses:
        '200':
          description: Successful response
    put:
      summary: Add Shipment Details
      operationId: putAddShipmentDetails
      tags:
      - Shipment
      description: '📌 Add Shipment Details API – Overview The Add Shipment Details API allows users to add existing shipment
        details for an order. This API is typically used to update shipment-related information such as: Tracking numbers
        (AWB) Courier service details Delivery tracking URLs 📌 Key Information This API applies only to orders where the shipment
        type is either: sales_channel_generated sales_channel_notified If the shipment was created by the sales channel, users
        can update the shipment details as requi'
      parameters:
      - name: order_id
        in: path
        required: true
        schema:
          type: string
      requestBody:
        content:
          application/json:
            example:
              tracking_url: https://tracking.fedex.com/123456789
              awb_number: AWB123456787
              awb_label: https://tracking.fedex.com/123456789.pdf
              package_details:
                number_of_boxes: 1
                weight: 1
                dimensions:
                  length: 30
                  breadth: 20
                  height: 15
                remarks: Handle with care
              courier_partner:
                tag: dhl_express
      responses:
        '200':
          description: Successful response
  /sales-channel/public/v1/orders/{order_id}/shipment/status:
    put:
      summary: Update Shipment Status
      operationId: putUpdateShipmentStatus
      tags:
      - Shipment
      description: '📌 Update Shipment Status API - Overview The Update Shipment Status API allows users to update the shipment
        status of an order, ensuring real-time tracking updates for better shipment visibility. 📌 Supported Shipment Types:
        Manual Shipment (omniful_generated) – Shipments created manually by users. Sales Channel Generated Shipment (sales_channel_generated)
        – Shipments generated by the sales channel system. Sales Channel Notified Shipment (sales_channel_notified) – Shipments
        updated based on notifi'
      parameters:
      - name: order_id
        in: path
        required: true
        schema:
          type: string
      requestBody:
        content:
          application/json:
            example:
              shipment_status: dispatched
      responses:
        '200':
          description: Successful response
