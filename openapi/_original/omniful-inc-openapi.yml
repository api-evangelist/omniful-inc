      description: '📌 Get Order Logs API – Overview The Get Order Logs API allows users to retrieve detailed logs for a specific
        order using its Order ID. It provides real-time insights into the order’s lifecycle within the warehouse, including:
        Status updates Fulfillment progress Modifications made to the order This API is particularly useful for: Tracking
        order history Troubleshooting operational issues Ensuring seamless order management Response Body Parameters Field
        Data Type Description Always Included is_succ'
      parameters:
      - name: order_id
        in: path
        required: true
        schema:
          type: string
      responses:
        '200':
          description: Successful response
