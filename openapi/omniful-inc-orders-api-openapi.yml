              order_alias: order_omniful-alias
              hub_code: locoff
              order_items:
              - sku_code: UT-TSHIRT-WHT-S-17
                name: iPhone 15 Pro
                display_price: 799
                selling_price: 699
                is_substituted: false
                quantity: 1
                tax_percent: 10
