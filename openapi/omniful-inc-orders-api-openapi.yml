                address1: 456 King Abdulaziz Road
                address2: Near Kingdom Centre
                city: Jeddah
                country: Saudi Arabia
                first_name: Jane
                last_name: Smith
                phone: +966-12-345-6789
                state: Makkah
                zip: '21577'
                area: Al Olaya
                district: Riyadh
                street: Kings Road
                state_code: MKA
                country_code: SA
                latitude: 21.4225
                longitude: 39.8262
                national_address_code: code
              invoice:
                currency: USD
                subtotal: 699
                shipping_price: 0
                shipping_refund: 0
                tax: 69.9
                discount: 100
                total: 768.9
                total_paid: 768.9
                total_due: 0
                total_refunded: 0
                payment_mode: Credit Card
                tax_percent: 10
                shipping_tax: 0
                sub_total_tax_inclusive: true
                sub_total_discount_inclusive: true
                shipping_tax_inclusive: false
                shipping_discount_inclusive: false
              customer:
                id: 66ced351ffed27dec7c4072a
                first_name: John
                last_name: Doe
                mobile: '1234567890'
                mobile_code: '+1'
                email: john.doe@example.com
                avatar: https://example.com/avatar.jpg
                gender: male
              labels:
              - label1
              - label2
              - label3
              slot:
                delivery_date: '18122024'
