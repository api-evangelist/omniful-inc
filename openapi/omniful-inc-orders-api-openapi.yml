                address1: 123 Al-Masjid Al-Haram Street
                address2: Near Al-Faisaliah Tower
                city: Riyadh
                country: Saudi Arabia
                first_name: John
                last_name: Doe
                phone: +966-11-234-5678
                state: Riyadh
                zip: '11564'
                area: Al Olaya
                district: Riyadh
                street: Kings Road
                state_code: RIY
                country_code: SA
