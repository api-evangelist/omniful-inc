aid: omniful-inc
name: Omniful, Inc.
description: >-
  Omniful is an AI-powered unified supply chain and fulfillment platform that
  consolidates order management (OMS), warehouse management (WMS), transportation
  management (TMS), inventory, point of sale, and returns into a single
  intelligent system for retailers, e-commerce businesses, logistics providers,
  and enterprises. The platform offers plug-and-play integrations with sales
  channels, marketplaces, and ERPs, multi-location and multi-brand operation
  support, and a set of public Integration APIs (seller/sales-channel, tenant,
  and TMS) with bearer-token authentication and webhook event subscriptions,
  documented as a public Postman collection at docs.omniful.tech. Omniful is a
  500 Global portfolio company operating primarily across the MENA region.
